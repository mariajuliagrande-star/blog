<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cuidados com Pets</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <header class="site-header">
        <div class="container">
            <h1>Agronomia</h1>
            <p>Inovação no campo: Tecnologias, soluções e tendências para o futuro do agronegócio.</p>
        </div>
    </header>

    <main class="site-main container">
        <article class="pet-card">
            <div class="image-container">
                <img src="Gemini_Generated_Image_m8syjtm8syjtm8sy.png" alt="Cachorro feliz correndo ao ar livre">
            </div>
            <div class="card-content">
                <h2>Saúde e Bem-estar</h2>
                <p>Mantenha a vacinação em dia e faça passeios regulares para garantir a alegria do seu amigo!</p>
                
                <button class="like-btn" id="likeBtn" onclick="toggleLike()">
                    <i class="fa-regular fa-heart" id="likeIcon"></i>
                    <span id="likeText">Curtir</span>
                </button>
            </div>
        </article>
    </main>

    <script>
        function toggleLike() {
            const btn = document.getElementById('likeBtn');
            const icon = document.getElementById('likeIcon');
            const text = document.getElementById('likeText');

            btn.classList.toggle('liked');

            if (btn.classList.contains('liked')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid');
                text.textContent = 'Curtido';
            } else {
                icon.classList.remove('fa-solid');
                icon.classList.add('fa-regular');
                text.textContent = 'Curtir';
            }
        }
    </script>

</body>
</html>
